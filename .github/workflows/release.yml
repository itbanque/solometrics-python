name: Release

# Publish by pushing a tag that matches src/solometrics/_version.py:
#   git tag v0.1.0 && git push origin v0.1.0

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Tag matches package version
        run: |
          pkg_version=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/solometrics/_version.py)
          if [ "v${pkg_version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match _version.py (${pkg_version})"
            exit 1
          fi
      - name: Build sdist and wheel
        run: uv build
      - name: Smoke-test the wheel
        run: |
          uv run --isolated --no-project --with dist/*.whl python -c \
            "import solometrics; print(solometrics.__version__); solometrics.Client('k').close()"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/solometrics/
    permissions:
      id-token: write # PyPI trusted publishing, no API token stored
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
